name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - ihtisham_v3
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm i --legacy-peer-deps && CI= npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIREMAN_DEV }}"
          channelId: live
          projectId: fireman-dev
